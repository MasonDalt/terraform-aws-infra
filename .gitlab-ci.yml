include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - plan
  - apply

fmt_check:
  stage: validate
  script:
    - terraform fmt -check -recursive
  image: hashicorp/terraform:latest

validate_check:
  stage: validate
  script:
    - cd modules/environments/dev
    - terraform init -backend=false
    - terraform validate
  image: hashicorp/terraform:latest

plan:
  stage: plan
  script:
    - cd modules/environments/dev
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - modules/environments/dev/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  image: hashicorp/terraform:latest

apply:
  stage: apply
  script:
    - cd modules/environments/dev
    - terraform init
    - terraform apply tfplan
  dependencies:
    - plan
  when: manual
  only:
    - main
  image: hashicorp/terraform:latest