include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - test
  - plan
  - apply

fmt_check:
  stage: validate
  script:
    - echo "Здесь terraform fmt -check"

validate_check:
  stage: validate
  script:
    - echo "Здесь terraform validate"

plan:
  stage: plan
  script:
    - echo "Здесь terraform plan -out=tfplan"
  artifacts:
    paths:
      - tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

apply:
  stage: apply
  script:
    - echo "Здесь terraform apply tfplan"
  dependencies:
    - plan
  when: manual
  only:
    - main
